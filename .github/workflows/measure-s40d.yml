name: Measure S40D startup wait (#48)

# Measurement only, never merged: arm64 builds of mvsce with the current
# startup timing (A) and with a wait for $HASP099 + 30 s before the first
# job (B).

on:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [A, B]
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: |
          wait=; [ "${{ matrix.variant }}" = B ] && wait=hasp099
          docker buildx build --progress plain --build-arg STARTUP_WAIT=$wait \
            -f mvsce/Dockerfile mvsce 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: build-${{ matrix.variant }}-${{ matrix.n }}
          path: build.log
