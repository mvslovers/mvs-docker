name: Build mvs-dev
run-name: Build mvs-dev

# Build and publish the mvs-dev development container (amd64 only - the
# c2asm370 cross-compiler ships as a 32-bit x86 binary, so there is no native
# arm64 build yet). On pull requests: build + smoke-test only (no push).

on:
  push:
    branches:
      - main
    paths:
      - "mvs-dev/**"
      - ".github/workflows/mvs-dev.yml"

  pull_request:
    paths:
      - "mvs-dev/**"
      - ".github/workflows/mvs-dev.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/mvslovers/mvs-dev

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build mvs-dev (amd64)
        uses: docker/build-push-action@v7
        with:
          context: ./mvs-dev
          platforms: linux/amd64
          load: true
          tags: mvs-dev:test

      - name: Smoke test
        run: |
          docker run --rm mvs-dev:test gh --version
          docker run --rm mvs-dev:test node --version
          docker run --rm mvs-dev:test nvim --version
          docker run --rm mvs-dev:test lazygit --version
          docker run --rm mvs-dev:test c2asm370 --version

      # The image's "core" version = the c2asm370 it contains, read from the
      # binary itself (no duplication). Tags: latest + <ver> (rolling) +
      # <ver>-<date> (immutable snapshot for pinning/rollback).
      - name: Derive c2asm370 version
        id: ver
        shell: bash
        run: |
          set -eo pipefail
          v=$(docker run --rm mvs-dev:test c2asm370 --version \
              | sed -n 's/.*c2asm370 version \([0-9][0-9.]*\).*/\1/p' | head -1)
          if [ -z "$v" ]; then echo "could not parse c2asm370 version" >&2; exit 1; fi
          d=$(date -u +%Y%m%d)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "date=$d" >> "$GITHUB_OUTPUT"
          echo "c2asm370 version: $v  (snapshot $v-$d)"

      - name: Push images
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          DATE: ${{ steps.ver.outputs.date }}
        run: |
          set -euo pipefail
          for tag in latest "$VERSION" "${VERSION}-${DATE}"; do
            echo "push ${IMAGE_NAME}:${tag}"
            docker tag mvs-dev:test "${IMAGE_NAME}:${tag}"
            docker push "${IMAGE_NAME}:${tag}"
          done
