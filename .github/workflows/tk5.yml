name: Build tk5
run-name: Build tk5 (${{ github.event_name == 'pull_request' && 'PR, no push' || ':dev' }})

# Builds tk5 natively for amd64 and arm64, starts each result and checks
# what runs in it, then assembles a multi-arch :dev from the two digests.
# Pull requests build and check only. Promoting :dev to :latest is
# promote.yml with image=tk5.

on:
  push:
    branches:
      - main
    paths:
      - "tk5/**"
      - ".github/workflows/tk5.yml"
  pull_request:
    paths:
      - "tk5/**"
      - ".github/workflows/tk5.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/mvslovers/tk5
  PUSH: ${{ github.event_name != 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./tk5
          platforms: linux/${{ matrix.arch }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Build (load)
        if: env.PUSH != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./tk5
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: tk5:test

      # Start the image and read back what runs: the Hercules commit must
      # match the label the build set, and TSO has to come up.
      - name: Start and check
        env:
          IMAGE: ${{ env.PUSH == 'true' && format('{0}@{1}', env.IMAGE_NAME, steps.push.outputs.digest) || 'tk5:test' }}
        run: |
          set -u
          [ "$PUSH" = true ] && docker pull -q "$IMAGE"
          ref=$(docker image inspect --format '{{index .Config.Labels "io.mvslovers.hercules.ref"}}' "$IMAGE")
          echo "label: hercules.ref=$ref"
          docker run -d --rm --name mvs -p 3270:3270 "$IMAGE"
          start=$(date +%s)
          up=
          for i in $(seq 1 240); do
            if docker logs mvs 2>&1 | grep -q 'IKT005I TCAS IS INITIALIZED'; then up=yes; break; fi
            if [ "$(docker inspect -f '{{.State.Status}}' mvs 2>/dev/null)" != running ]; then
              echo "container stopped"; docker logs --tail 50 mvs 2>&1 || true; exit 1
            fi
            sleep 1
          done
          echo "TSO up after $(( $(date +%s) - start ))s: ${up:-no}"
          [ -n "$up" ] || { docker logs --tail 50 mvs 2>&1; exit 1; }
          banner=$(docker logs mvs 2>&1 | grep -m 1 HHC01413I)
          echo "$banner"
          sha=$(echo "$banner" | sed -n 's/.*-g\([0-9a-f]\{7,\}\).*/\1/p')
          case "$ref" in "$sha"*) [ -n "$sha" ] ;; *) echo "Hercules g$sha, label $ref"; exit 1 ;; esac
          docker stop mvs >/dev/null

      - name: Record digest
        if: env.PUSH == 'true'
        run: |
          # artifact file names may not contain ':', so without "sha256:"
          mkdir -p digests
          d="${{ steps.push.outputs.digest }}"
          touch "digests/${d#sha256:}"
          ls digests

      - uses: actions/upload-artifact@v6
        if: env.PUSH == 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create :dev from the two digests
        working-directory: digests
        run: |
          ls
          [ "$(ls | wc -l)" -eq 2 ] || { echo "expected two digests"; exit 1; }
          docker buildx imagetools create -t ${{ env.IMAGE_NAME }}:dev \
            $(for d in *; do echo "${{ env.IMAGE_NAME }}@sha256:$d"; done)
          docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:dev
