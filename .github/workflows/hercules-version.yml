name: Build Hercules Version
run-name: Build Hercules ${{ inputs.version }}

# Manually build a single pinned Hercules release. Input is the Hyperion tag
# suffix (what follows "Release_"):
#   "4.8"   -> ref Release_4.8   -> image tag 4.8.0
#   "4.9.1" -> ref Release_4.9.1 -> image tag 4.9.1
# The exact image tag is normalized to 3 components so it never collides with a
# rolling alias. The actual build is delegated to the reusable hercules-build-one.
#
# This does NOT touch :latest or rolling aliases - run "Retag Hercules aliases"
# afterwards to (re)compute them.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Hyperion tag suffix (e.g. 4.8 or 4.9.1)"
        required: true
        default: "4.9.1"

permissions:
  contents: read
  packages: write

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.norm.outputs.tag }}
      ref: ${{ steps.norm.outputs.ref }}
    steps:
      - name: Normalize version
        id: norm
        shell: bash
        run: |
          set -euo pipefail
          v="${{ inputs.version }}"
          IFS=. read -r a b c <<< "$v"
          tag="${a}.${b:-0}.${c:-0}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "ref=Release_${v}" >> "$GITHUB_OUTPUT"
          echo "input '${v}' -> ref Release_${v}, image tag ${tag}"

  build:
    needs: prep
    uses: ./.github/workflows/hercules-build-one.yml
    with:
      version: ${{ needs.prep.outputs.tag }}
      ref: ${{ needs.prep.outputs.ref }}
    secrets: inherit
