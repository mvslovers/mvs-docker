name: Build Hercules Version

# Manually build a pinned Hercules release from a Hyperion git tag.
# Input "4.9.1" -> Dockerfile build-arg HERCULES_REF=Release_4.9.1
# -> image tags 4.9.1 / 4.9.1-amd64 / 4.9.1-arm64 (+ multi-arch manifest).
#
# This does NOT touch :latest or rolling aliases (4 / 4.9) yet - that logic
# (and automatic release detection) comes with the scheduled poll, once this
# manual path is proven.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Hyperion release version (e.g. 4.9.1 -> Release_4.9.1)"
        required: true
        default: "4.9.1"

env:
  IMAGE_NAME: ghcr.io/mvslovers/hercules

jobs:
  build-amd64:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build amd64
        uses: docker/build-push-action@v7
        with:
          context: ./hercules
          platforms: linux/amd64
          load: true
          build-args: |
            HERCULES_REF=Release_${{ inputs.version }}
          tags: hercules:test-amd64

      - name: Test amd64 image
        run: |
          docker run --rm hercules:test-amd64 hercules --version

      - name: Push amd64 image
        run: |
          docker tag hercules:test-amd64 ${{ env.IMAGE_NAME }}:${{ inputs.version }}-amd64
          docker push ${{ env.IMAGE_NAME }}:${{ inputs.version }}-amd64

  build-arm64:
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build arm64
        uses: docker/build-push-action@v7
        with:
          context: ./hercules
          platforms: linux/arm64
          load: true
          build-args: |
            HERCULES_REF=Release_${{ inputs.version }}
          tags: hercules:test-arm64

      - name: Test arm64 image
        run: |
          docker run --rm hercules:test-arm64 hercules --version

      - name: Push arm64 image
        run: |
          docker tag hercules:test-arm64 ${{ env.IMAGE_NAME }}:${{ inputs.version }}-arm64
          docker push ${{ env.IMAGE_NAME }}:${{ inputs.version }}-arm64

  manifest:
    needs:
      - build-amd64
      - build-arm64

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create version manifest
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE_NAME }}:${{ inputs.version }} \
            ${{ env.IMAGE_NAME }}:${{ inputs.version }}-amd64 \
            ${{ env.IMAGE_NAME }}:${{ inputs.version }}-arm64

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect \
            ${{ env.IMAGE_NAME }}:${{ inputs.version }}
