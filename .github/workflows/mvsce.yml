name: Build mvsce
run-name: Build mvsce (${{ github.event_name == 'pull_request' && 'PR, no push' || ':dev' }})

# Builds mvsce natively for amd64 and arm64 (the build IPLs MVS, so
# no emulation), starts each result and checks what runs in it, then
# assembles a multi-arch :dev from the two digests. Pull requests build and
# check only. Promoting :dev to :latest is promote.yml.

on:
  push:
    branches:
      - main
    paths:
      - "mvsce/Dockerfile"
      - "mvsce/setup_mvsce.py"
      - "mvsce/entrypoint.sh"
      - ".github/workflows/mvsce.yml"
  pull_request:
    paths:
      - "mvsce/Dockerfile"
      - "mvsce/setup_mvsce.py"
      - "mvsce/entrypoint.sh"
      - ".github/workflows/mvsce.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/mvslovers/mvsce
  PUSH: ${{ github.event_name != 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./mvsce
          platforms: linux/${{ matrix.arch }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Build (load)
        if: env.PUSH != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./mvsce
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: mvsce:test

      # Start the image and read back what runs: the Hercules commit and the
      # mvsMF level must match the labels the build set, and FTPD has to
      # greet right away (with domain 1's minimum MPL of 1 the SRM held it
      # about 30 s after the IPL, ftpd#176), and SHUTFAST has to end it all.
      - name: Start and check
        env:
          IMAGE: ${{ env.PUSH == 'true' && format('{0}@{1}', env.IMAGE_NAME, steps.push.outputs.digest) || 'mvsce:test' }}
        run: |
          set -u
          [ "$PUSH" = true ] && docker pull -q "$IMAGE"
          label() { docker image inspect --format "{{index .Config.Labels \"$1\"}}" "$IMAGE"; }
          ref=$(label io.mvslovers.hercules.ref)
          mvsmf=$(label io.mvslovers.mvsmf.version)
          echo "labels: hercules.ref=$ref mvsmf=$mvsmf"
          docker run -d --rm --name mvs -p 8080:8080 -p 2121:2121 "$IMAGE"
          start=$(date +%s)
          for i in $(seq 1 180); do
            v=$(curl -s -u IBMUSER:SYS1 'http://localhost:8080/zosmf/test?fn=version' || true)
            case "$v" in *'"version"'*) break ;; esac
            if [ "$(docker inspect -f '{{.State.Status}}' mvs 2>/dev/null)" != running ]; then
              echo "container stopped"; exit 1
            fi
            sleep 1
          done
          echo "after $(( $(date +%s) - start ))s: $v"
          greet=$(timeout 10 bash -c 'exec 3<>/dev/tcp/localhost/2121; head -c 3 <&3' || true)
          echo "FTP greeting after $(( $(date +%s) - start ))s: $greet"
          [ "$greet" = 220 ] || { echo "FTPD did not greet within 10 s"; exit 1; }
          # from the log file itself: `docker logs` follows it with tail -F
          # and can lag behind (seen on arm64: empty 2 s after the start)
          for i in $(seq 1 30); do
            banner=$(docker exec mvs grep -m 1 HHC01413I /logs/hercules.log || true)
            [ -n "$banner" ] && break
            sleep 1
          done
          echo "$banner"
          docker exec mvs grep -E 'UFSD000I|HTTPD000I|FTPD000I' /logs/hercules.log | head -n 3
          sha=$(echo "$banner" | sed -n 's/.*-g\([0-9a-f]\{7,\}\).*/\1/p')
          case "$ref" in "$sha"*) [ -n "$sha" ] ;; *) echo "Hercules g$sha, label $ref"; exit 1 ;; esac
          case "$v" in *"\"version\": \"$mvsmf\""*) ;; *) echo "mvsMF does not report $mvsmf"; exit 1 ;; esac
          # SHUTFAST, the servers still up, has to end MVS and the container
          t0=$(date +%s)
          curl -s -u IBMUSER:SYS1 -X PUT -H 'Content-Type: text/plain' -H 'X-IBM-Intrdr-Mode: TEXT' \
            --data-binary $'//SHUTFAST JOB (JOB),\'SHUTFAST\',CLASS=A,MSGCLASS=A\n//SHUTFAST EXEC SHUTDOWN,TYPE=\'SHUTFAST\'\n' \
            'http://localhost:8080/zosmf/restjobs/jobs' >/dev/null
          for i in $(seq 1 180); do
            [ "$(docker inspect -f '{{.State.Status}}' mvs 2>/dev/null)" = running ] || break
            sleep 1
          done
          echo "container ended $(( $(date +%s) - t0 ))s after SHUTFAST"
          if [ "$(docker inspect -f '{{.State.Status}}' mvs 2>/dev/null)" = running ]; then
            docker logs --tail 40 mvs 2>&1; echo "SHUTFAST did not end the container"; docker stop mvs >/dev/null; exit 1
          fi

      - name: Record digest
        if: env.PUSH == 'true'
        run: |
          # artifact file names may not contain ':', so without "sha256:"
          mkdir -p digests
          d="${{ steps.push.outputs.digest }}"
          touch "digests/${d#sha256:}"
          ls digests

      - uses: actions/upload-artifact@v6
        if: env.PUSH == 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create :dev from the two digests
        working-directory: digests
        run: |
          ls
          [ "$(ls | wc -l)" -eq 2 ] || { echo "expected two digests"; exit 1; }
          docker buildx imagetools create -t ${{ env.IMAGE_NAME }}:dev \
            $(for d in *; do echo "${{ env.IMAGE_NAME }}@sha256:$d"; done)
          docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:dev
