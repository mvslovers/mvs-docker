name: Build Hercules
run-name: Build Hercules edge

on:
  push:
    branches:
      - main
    paths:
      - "hercules/**"
      - ".github/workflows/hercules.yml"

  pull_request:
    paths:
      - "hercules/**"
      - ".github/workflows/hercules.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Build :edge from Hyperion main HEAD via the shared reusable build.
  # On pull requests: build + smoke-test only (push=false, no manifest).
  # :latest is owned by the retag workflow; the push CI publishes :edge only.
  edge:
    uses: ./.github/workflows/hercules-build-one.yml
    with:
      version: edge
      push: ${{ github.event_name != 'pull_request' }}
    secrets: inherit
