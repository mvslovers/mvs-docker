name: Build Hercules

on:
  push:
    branches:
      - main
    # NOTE: "hercules/" matcht als Glob keine Dateien im Verzeichnis.
    # Korrekt waere "hercules/**". Bewusst NICHT gefixt, damit der Workflow
    # aktuell breit ausgeloest wird und ohne Dockerfile-Aenderung testbar bleibt.
    # TODO: spaeter auf "hercules/**" umstellen.
    paths:
      - "hercules/"
      - ".github/workflows/hercules.yml"

  pull_request:
    # TODO: siehe oben - spaeter auf "hercules/**" umstellen.
    paths:
      - "hercules/"
      - ".github/workflows/hercules.yml"

  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/mvslovers/hercules

jobs:
  build-amd64:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build amd64
        uses: docker/build-push-action@v7
        with:
          context: ./hercules
          platforms: linux/amd64
          load: true
          tags: hercules:test-amd64

      - name: Test amd64 image
        run: |
          docker run --rm hercules:test-amd64 hercules --version

      - name: Push amd64 image
        if: github.event_name != 'pull_request'
        run: |
          docker tag hercules:test-amd64 ${{ env.IMAGE_NAME }}:edge-amd64
          docker push ${{ env.IMAGE_NAME }}:edge-amd64

  build-arm64:
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build arm64
        uses: docker/build-push-action@v7
        with:
          context: ./hercules
          platforms: linux/arm64
          load: true
          tags: hercules:test-arm64

      - name: Test arm64 image
        run: |
          docker run --rm hercules:test-arm64 hercules --version

      - name: Push arm64 image
        if: github.event_name != 'pull_request'
        run: |
          docker tag hercules:test-arm64 ${{ env.IMAGE_NAME }}:edge-arm64
          docker push ${{ env.IMAGE_NAME }}:edge-arm64

  manifest:
    needs:
      - build-amd64
      - build-arm64

    if: github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create edge manifest
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE_NAME }}:edge \
            ${{ env.IMAGE_NAME }}:edge-amd64 \
            ${{ env.IMAGE_NAME }}:edge-arm64

      # NOTE: :latest is owned by the retag workflow (= newest release), the
      # push CI publishes :edge only and must not touch :latest.

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect \
            ${{ env.IMAGE_NAME }}:edge
